# Nordic Lux — local development stack.
#
#   docker compose up -d          start infrastructure
#   npm run db:migrate && npm run db:seed
#   npm run dev
#
# The `app` service is only needed for a production-shaped run:
#   docker compose --profile app up --build
#
# Every service has a healthcheck so `depends_on: condition: service_healthy`
# actually means something. Volumes are named, never bind mounts, so data
# survives `docker compose down` (use `down -v` to wipe deliberately).

services:
  postgres:
    image: postgres:17-alpine
    container_name: nordiclux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nordiclux
      POSTGRES_PASSWORD: nordiclux_dev_password
      POSTGRES_DB: nordiclux
      # Deterministic collation keeps ORDER BY stable across host platforms.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nordiclux -d nordiclux']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: nordiclux-valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    ports:
      # Published on 6380, not the stock 6379: a Redis already running on the
      # host would both block this container and silently accept the app's
      # connection, mixing Nordic Lux keys into an unrelated datastore.
      - '6380:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: nordiclux-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: nordiclux_dev_master_key
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nordiclux-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nordiclux
      MINIO_ROOT_PASSWORD: nordiclux_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the media bucket once, then exits. Not a long-running service.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nordiclux nordiclux_dev_password &&
      mc mb --ignore-existing local/nordiclux-media &&
      mc anonymous set download local/nordiclux-media
      "
    restart: 'no'

  # Local SMTP sink with a web inbox at http://localhost:8025 — no mail
  # ever leaves the machine in development.
  mailpit:
    image: axllent/mailpit:latest
    container_name: nordiclux-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nordiclux-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://nordiclux:nordiclux_dev_password@postgres:5432/nordiclux
      REDIS_URL: redis://valkey:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  valkey_data:
  meilisearch_data:
  minio_data:
